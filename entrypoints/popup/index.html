<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meaw Machine</title>
    <meta name="manifest.browser_style" content="true" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body
    style="
      box-sizing: border-box;
      min-width: 320px;
      padding: 12px;
      margin: 0;
      font:
        14px/1.4 system-ui,
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      color: #0f172a;
      background: #f8fafc;
    "
  >
    <div style="padding-bottom: 10px; font-weight: 700; font-size: 15px">Meaw Machine</div>

    <label for="meaw-ws-url" style="display: block; padding-bottom: 6px; font-weight: 600">WebSocket URL</label>
    <input
      id="meaw-ws-url"
      type="url"
      placeholder="wss://your-server.example/ws"
      style="
        box-sizing: border-box;
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font: inherit;
      "
    />

    <div style="padding-top: 10px; display: flex; gap: 8px; flex-wrap: wrap">
      <button id="meaw-connect" type="button" style="padding: 8px 14px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer">
        Connect
      </button>
      <button id="meaw-disconnect" type="button" style="padding: 8px 14px; border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; font-weight: 600; cursor: pointer">
        Disconnect
      </button>
    </div>

    <div id="meaw-status" style="padding-top: 12px; font-size: 13px; color: #334155"></div>
    <div id="meaw-controlled" style="padding-top: 8px; font-size: 12px; color: #64748b"></div>
  </body>
</html>
